<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personalized Product Finder</title><link rel="stylesheet" href="styles.css"></head><body><header><a class="brand">FIND<span>WISE</span></a><span>Personalized product discovery</span></header><main><section class="hero"><p class="eyebrow">A SMARTER WAY TO SHOP</p><h1>Products picked<br>for <span>your life.</span></h1><p>Share what you’re looking for and we’ll match products from connected stores.</p></section><section class="panel"><h2>About you</h2><form id="profile"><label>Your name<input name="name" required placeholder="Name"></label><label>Age<input name="age" type="number" min="13" max="120" required placeholder="Age"></label><label>What are you interested in?<textarea name="interests" required placeholder="e.g. affordable running shoes, coffee, skincare"></textarea></label><label>Maximum price (USD)<input name="budget" type="number" min="0" placeholder="No limit"></label><label>Category (optional)<input name="category" placeholder="Home, fashion, electronics..."></label><button>Find my products</button></form><p id="status">Fill in your profile to get started.</p></section><section><h2 id="results-title">Your recommendations</h2><div id="results" class="grid"></div></section></main><footer>Findwise · Better discoveries, tailored to you</footer><script src="app.js"></script></body></html>
